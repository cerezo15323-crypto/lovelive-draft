<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOVE LIVE! DRAFT CONFERENCE</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#071321;color:#edf2f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#19334a,#071321 65%)}main{width:min(940px,95vw);margin:0 auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{letter-spacing:.15em;color:#d7bc87;font-size:12px}.heading{font-size:clamp(24px,5vw,42px);margin:6px 0 22px}.panel{border:1px solid #35485c;background:#122235ed;padding:22px;border-radius:18px;margin-bottom:16px}.muted{color:#a9b6c8}.gold{color:#ddc18a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.field{display:grid;gap:8px;margin-bottom:14px}input,select{background:#09192b;border:1px solid #526175;border-radius:9px;padding:12px;color:#fff;font:inherit;width:100%}input[type=checkbox]{width:auto;accent-color:#d7b875}label{cursor:pointer}button{border:0;border-radius:10px;padding:12px 19px;font:inherit;font-weight:700;cursor:pointer;background:#d9ba79;color:#172238}button.secondary{background:#253e57;color:#ecf5ff}button:disabled{opacity:.45;cursor:not-allowed}.choice{background:#1d3045;border:1px solid #334d66;padding:10px 12px;border-radius:9px}.status{display:inline-block;padding:6px 11px;border-radius:30px;background:#234635;color:#b9f5d1;font-size:12px}.screen{background:linear-gradient(145deg,#1a3148,#0d1829);border:1px solid #715e40;min-height:265px;border-radius:13px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:15px;animation:enter .55s ease}.school{color:#dfc68f;font-size:clamp(16px,3vw,22px)}.person{font-size:clamp(34px,7vw,67px);font-weight:800;letter-spacing:.06em;animation:enter .65s ease}.team{font-size:clamp(20px,4vw,32px);font-weight:700}.big{font-size:25px;font-weight:800}.envelopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}.envelope{min-height:140px;border:2px solid #8d7952;background:linear-gradient(135deg,#d3bb8e,#8d754e);color:#1b2732;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;transition:transform .2s}.envelope:not(:disabled):hover{transform:translateY(-5px)}.envelope small{font-size:13px}.pick{border-bottom:1px solid #30455a;padding:8px 2px}.pick:last-child{border:0}.small{font-size:13px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#74313a;color:#fff;padding:13px 20px;border-radius:10px;z-index:3;box-shadow:0 3px 30px #0009}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.panel{padding:16px}.envelope{min-height:105px;font-size:35px}}
</style></head><body><main><div class="top"><span class="brand">LOVE LIVE! DRAFT CONFERENCE</span><span id="roomTag" class="status hidden"></span></div><h1 class="heading">スクールアイドル ドラフト会議</h1><div id="app"></div></main><script>
const $=s=>document.querySelector(s);const app=$('#app');let meta=[],state=null,session=JSON.parse(localStorage.getItem('lldraft-session')||'null');let selected=null;let events=null;let showDetails=false;
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=escapeHTML;function msg(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3800)}
async function api(route,data){let resp=await fetch('/api/'+route,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...data,...(session?{code:session.code,token:session.token}:{})})});let result=await resp.json();if(!resp.ok)throw Error(result.error||'通信に失敗したよ');return result;}
async function action(route,data={}){try{await api(route,data);await refresh()}catch(e){msg(e.message)}}
async function refresh(){if(!session)return render();try{const q=new URLSearchParams({room:session.code,token:session.token});const response=await fetch('/api/state?'+q);if(!response.ok)throw Error('ルームが見つからないよ');let s=await response.json();const old=state?.stage;state=s;if(old!==s.stage)selected=null;render();}catch(e){msg(e.message);session=null;state=null;localStorage.removeItem('lldraft-session');render();}}
function listen(){if(events)events.close();events=new EventSource('/api/events?room='+session.code);events.onmessage=()=>refresh();}
function setSession(s){session=s;localStorage.setItem('lldraft-session',JSON.stringify(session));listen();refresh()}
function player(id){return state.players.find(p=>p.id===id)}
function picker(){let list=state.candidates,groups=[...new Set(list.map(c=>c.group))];return `<div class="field"><label>指名候補を選択（学校・名前で検索可）</label><input id="search" placeholder="キャラ名・学校名を入力" oninput="filterCandidates()"><select id="candidate" size="8" onchange="selected=this.value">${list.map(c=>`<option value="${c.id}">${esc(c.school)} ／ ${esc(c.name)}</option>`).join('')}</select></div>`}
function filterCandidates(){const q=$('#search').value.toLowerCase();const chosen=selected;$('#candidate').innerHTML=state.candidates.filter(c=>(c.school+c.name+c.groupLabel).toLowerCase().includes(q)).map(c=>`<option value="${c.id}" ${c.id===chosen?'selected':''}>${esc(c.school)} ／ ${esc(c.name)}</option>`).join('');}
function chosen(){return selected||$('#candidate')?.value;}
function screen(c,team){return `<div class="screen"><div class="gold">第${state.round}回 選択希望スクールアイドル</div><div class="team">${esc(team)}</div><div class="school">${esc(c.school)}</div><div class="person">${esc(c.name)}</div></div>`}
function buttons(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{const route=b.dataset.route;const c=chosen();if(['bid','waiver'].includes(route)&&!c)return msg('候補者を選んでね');action(route,{candidate:c});});}
function render(){const tag=$('#roomTag');tag.classList.toggle('hidden',!session);tag.textContent=session?'ROOM '+session.code:'';if(!session){app.innerHTML=`<div class="grid"><section class="panel"><h2>ルームを作成</h2><div class="field"><label>球団名</label><input id="createName" maxlength="24" value="球団A"></div><div class="field"><label>球団数</label><select id="teams">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option ${n===5?'selected':''} value="${n}">${n}球団</option>`).join('')}</select></div><div class="field"><label>1球団の最大指名人数</label><select id="maxPicks"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></div><p>対象グループ（複数選択）</p><div class="field">${meta.map(w=>`<label class="choice"><input type="checkbox" class="group" value="${w.id}" checked> ${esc(w.label)}（${w.count}人）</label>`).join('')}</div><div class="muted small" id="capacity"></div><br><button id="create">ルーム作成</button></section><section class="panel"><h2>ルームに参加</h2><div class="field"><label>ルームコード</label><input id="joinCode" maxlength="8" placeholder="例：A1B2C3D4"></div><div class="field"><label>球団名</label><input id="joinName" maxlength="24" placeholder="あなたの球団名"></div><button id="join">参加する</button><p class="muted small">同じルームURLを共有すれば、別の端末から参加できるよ。</p></section></div>`;const capacity=()=>{const count=[...document.querySelectorAll('.group:checked')].reduce((sum,x)=>sum+meta.find(w=>w.id===x.value).count,0);$('#capacity').textContent=`候補 ${count}人 ／ 最大指名枠 ${Number($('#teams').value)*Number($('#maxPicks').value)}人`;};document.querySelectorAll('.group,#teams,#maxPicks').forEach(el=>el.addEventListener('change',capacity));capacity();$('#create').onclick=async()=>{try{let groups=[...document.querySelectorAll('.group:checked')].map(e=>e.value);const s=await api('create',{groups,teams:Number($('#teams').value),maxPicks:Number($('#maxPicks').value),name:$('#createName').value});setSession(s)}catch(e){msg(e.message)}};$('#join').onclick=async()=>{try{const s=await api('join',{code:$('#joinCode').value,name:$('#joinName').value});setSession(s)}catch(e){msg(e.message)}};return;}
if(!state)return;let x=`<section class="panel"><div class="row between"><div><span class="gold">${esc(state.settings.teams)}球団 ／ ${state.settings.maxPicks}巡上限</span><p class="muted small">参加作品：${state.settings.groups.map(g=>meta.find(w=>w.id===g)?.label||g).join('・')}</p></div><button class="secondary" id="share">ルームURLをコピー</button></div><div class="grid">${state.players.map(p=>`<div class="choice"><b>${esc(p.name)}</b>${p.id===state.selfId?'（あなた）':''}<div class="muted small">獲得 ${p.picks.length}人</div></div>`).join('')}</div></section>`;
if(state.stage==='lobby'){x+=`<section class="panel"><h2>参加者を受付中</h2><p>${state.players.length} / ${state.settings.teams} 球団が参加済み</p><p class="muted">全員揃ったらドラフト開始！</p>${state.host?`<button data-route="start" ${state.players.length!==state.settings.teams?'disabled':''}>ドラフト会議を開始</button>`:'<p>ホストの開始を待ってね。</p>'}</section>`;}
if(state.stage==='auction'){const eligible=state.auctionTeams.includes(state.selfId);x+=`<section class="panel"><h2>第1巡 ${state.round===1?'入札':'外れ指名・再入札'}</h2><p class="muted">指名確定 ${state.submitted} / ${state.required} 球団。候補は発表まで非公開。</p>${eligible?(state.submittedMine?'<div class="status">指名提出済み。発表を待とう！</div>':`${picker()}<button data-route="bid">この選手を指名確定</button>`):'<p>今回の入札対象ではないよ。抽選結果を待ってね。</p>'}</section>`;}
if(state.stage==='reveal'){const q=state.announcement;x+=`<section class="panel"><div class="row between"><h2>第1巡 指名発表</h2><span class="gold">発表 ${state.queueIndex} / ${state.queue.length}</span></div>${q?screen(q.candidate,player(q.team).name):'<div class="screen"><span class="gold">第1回 選択希望スクールアイドル</span><div class="big">指名発表を開始します</div></div>'}<p class="muted">各球団の提出内容を順番に公開。全員分の発表後、競合抽選へ。</p>${state.host?`<button data-route="reveal">${state.queueIndex===state.queue.length?'発表を終了・競合抽選へ':'次の球団を発表'}</button>`:'<p>ホストの発表操作を待ってね。</p>'}</section>`;}
if(state.stage==='lottery'){const l=state.lottery,c=state.candidates.find(x=>x.id===l.candidate)||state.history.find(x=>x.candidate.id===l.candidate)?.candidate;let current=l.teams[l.drawIndex];const myTurn=current===state.selfId;const myDraw=l.draws.find(d=>d.team===state.selfId&&!d.opened);const used=l.draws.map(d=>d.envelope);x+=`<section class="panel"><h2>交渉権獲得抽選　${l.teams.length}球団競合</h2><div class="screen"><div class="school">${esc(c?.school)}</div><div class="person">${esc(c?.name)}</div><div class="muted">${l.teams.map(id=>esc(player(id).name)).join(' ／ ')}</div></div><p class="gold">${l.revealed?'抽選終了':myDraw?'封筒を開けて結果を確認！':current?`${esc(player(current).name)} が抽選する番！`:'抽選終了'}</p><div class="envelopes">${Array.from({length:l.teams.length},(_,i)=>{let d=l.draws.find(d=>d.envelope===i);return `<button class="envelope" ${!myTurn||!!myDraw||!!d||l.revealed?'disabled':''} data-envelope="${i}"><span>${d?.opened?(d.win?'★':'×'):'✉'}</span><small>封筒 ${i+1}</small><small>${d?esc(player(d.team).name):'未選択'}</small></button>`}).join('')}</div>${myDraw?'<p><button data-route="open">自分の封筒を開封する</button></p>':''}<div class="panel" style="margin-top:18px">${l.draws.map(d=>`<div class="pick">${esc(player(d.team).name)} — ${d.opened?(d.win?'<b class="gold">当選！ 交渉権獲得</b>':'外れ'): '開封待ち'}</div>`).join('')||'<span class="muted">まだ誰も引いていません</span>'}</div>${l.revealed?(state.host?'<button data-route="next-lottery">次へ進む</button>':'<p>ホストの進行を待ってね。</p>'):''}</section>`;}
if(state.stage==='waiver'){let turn=state.waiverTurn,p=player(turn);x+=`<section class="panel"><h2>第${state.round}巡 ウェーバー指名</h2><p class="gold big">${esc(p?.name||'')} の指名順</p>${turn===state.selfId?`${picker()}<button data-route="waiver">指名を確定・発表</button>`:'<p class="muted">指名確定を待ってね。</p>'}</section>`;}
if(state.stage==='done'){x+='<section class="panel"><h2>ドラフト会議 終了！</h2><div class="screen"><div class="big gold">全指名が確定しました</div><div>おつかれさま！</div></div></section>'}
x+=`<section class="panel"><div class="row between"><h2>指名結果</h2><span class="muted small">${state.history.length}人指名済み</span></div><div class="grid">${state.players.map(p=>`<div class="choice"><b>${esc(p.name)}</b>${p.picks.map((id,i)=>{const h=state.history.find(h=>h.candidate.id===id);return `<div class="pick small">${i+1}位　${esc(h?.candidate.school||'')}<br><b>${esc(h?.candidate.name||'')}</b></div>`}).join('')||'<p class="muted small">指名なし</p>'}</div>`).join('')}</div></section>`;
app.innerHTML=x;$('#share').onclick=async()=>{const url=location.origin+location.pathname+'?room='+session.code;try{await navigator.clipboard.writeText(url);msg('URLをコピーしたよ！')}catch{prompt('このURLを共有してね',url)}};buttons();document.querySelectorAll('[data-envelope]').forEach(b=>b.onclick=()=>action('draw',{envelope:Number(b.dataset.envelope)}));}
(async()=>{try{meta=(await(await fetch('/api/meta')).json()).works;const param=new URLSearchParams(location.search).get('room');if(!session&&param){render();$('#joinCode').value=param;}else if(session){listen();await refresh()}else render()}catch(e){app.innerHTML='<div class="panel">読み込みに失敗しました。ページを再読み込みしてね。</div>'}})();
</script></body></html>
