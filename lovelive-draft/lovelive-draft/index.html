<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LOVE LIVE! DRAFT CONFERENCE</title>
  <style>
    :root{
      --bg1:#071321;--bg2:#0d1f34;--panel:#122235ee;--line:#35485c;--text:#edf2f9;--muted:#a9b6c8;--gold:#ddc18a;--gold2:#f0d6a0;
      font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#19334a,#071321 65%)}
    main{width:min(980px,95vw);margin:0 auto;padding:24px 0 80px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{letter-spacing:.16em;color:#d7bc87;font-size:12px}
    .heading{font-size:clamp(24px,5vw,42px);margin:6px 0 22px}
    .panel{border:1px solid var(--line);background:var(--panel);padding:22px;border-radius:18px;margin-bottom:16px;box-shadow:0 12px 36px #0005}
    .muted{color:var(--muted)}
    .gold{color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .between{justify-content:space-between}
    .field{display:grid;gap:8px;margin-bottom:14px}
    input,select{background:#09192b;border:1px solid #526175;border-radius:9px;padding:12px;color:#fff;font:inherit;width:100%}
    input[type=checkbox]{width:auto;accent-color:#d7b875}
    label{cursor:pointer}
    button{border:0;border-radius:10px;padding:12px 19px;font:inherit;font-weight:700;cursor:pointer;background:#d9ba79;color:#172238;transition:transform .15s ease,opacity .15s ease,filter .15s ease}
    button.secondary{background:#253e57;color:#ecf5ff}
    button.ghost{background:transparent;border:1px solid #5d738a;color:#dbe8f6}
    button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.03)}
    button:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .choice{background:#1d3045;border:1px solid #334d66;padding:10px 12px;border-radius:9px}
    .status{display:inline-block;padding:6px 11px;border-radius:30px;background:#234635;color:#b9f5d1;font-size:12px}
    .hidden{display:none!important}
    .small{font-size:13px}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#74313a;color:#fff;padding:13px 20px;border-radius:10px;z-index:30;box-shadow:0 3px 30px #0009;max-width:min(92vw,520px)}

    .announcement{
      position:relative;overflow:hidden;min-height:330px;padding:26px 20px;border-radius:18px;
      border:1px solid #7b6540;background:
        radial-gradient(circle at 50% 10%,rgba(255,220,154,.12),transparent 35%),
        linear-gradient(160deg,#102336,#0a1627 62%,#091220);
      display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 16px 40px #0007;
    }
    .announcement::before,.announcement::after{content:"";position:absolute;inset:auto 0;height:2px;background:linear-gradient(90deg,transparent,#d9ba79,transparent);opacity:.65}
    .announcement::before{top:20px}.announcement::after{bottom:20px}
    .announce-kicker,.announce-round,.announce-team,.announce-school,.announce-name,.announce-sub{opacity:0;transform:translateY(14px);animation:fadeUp .62s ease forwards}
    .announce-kicker{color:#f0d6a0;font-weight:700;letter-spacing:.12em;font-size:12px;animation-delay:.06s}
    .announce-round{color:var(--gold);font-size:clamp(15px,2.5vw,22px);animation-delay:.34s}
    .announce-team{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.06em;animation-delay:.85s}
    .announce-school{font-size:clamp(16px,3vw,24px);color:var(--gold2);animation-delay:1.4s}
    .announce-name{font-size:clamp(40px,7vw,70px);font-weight:900;letter-spacing:.08em;animation-delay:2.05s;text-shadow:0 0 24px rgba(255,223,153,.15)}
    .announce-sub{font-size:14px;color:#c4d0df;animation-delay:2.65s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .screen{background:linear-gradient(145deg,#1a3148,#0d1829);border:1px solid #715e40;min-height:265px;border-radius:13px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:15px}
    .school{color:#dfc68f;font-size:clamp(16px,3vw,22px)}
    .person{font-size:clamp(34px,7vw,67px);font-weight:800;letter-spacing:.06em}
    .team{font-size:clamp(20px,4vw,32px);font-weight:700}
    .big{font-size:25px;font-weight:800}
    .envelopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
    .envelope{min-height:140px;border:2px solid #8d7952;background:linear-gradient(135deg,#d3bb8e,#8d754e);color:#1b2732;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;transition:transform .2s}
    .envelope:not(:disabled):hover{transform:translateY(-5px)}
    .envelope small{font-size:13px}
    .pick{border-bottom:1px solid #30455a;padding:8px 2px}
    .pick:last-child{border:0}

    .school-tabs,.candidate-tabs{display:flex;flex-wrap:wrap;gap:8px}
    .school-tab,.candidate-tab{background:#192e42;color:#e5edf6;border:1px solid #47617b;padding:11px 15px;border-radius:10px;font-size:14px}
    .school-tab.active,.candidate-tab.active{background:#d9ba79;color:#172238;border-color:#f1d79f;box-shadow:0 0 0 2px #d9ba7930}
    .candidate-tab{min-width:110px;flex:1 1 140px}
    .results{display:grid;gap:10px}
    .result-item{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#17283a;border:1px solid #2c4258}
    .badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#d9ba79;color:#162235;font-weight:800}
    .result-title{font-weight:800}
    .result-meta{font-size:12px;color:#b6c4d6;margin-top:3px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    @media(max-width:600px){.panel{padding:16px}.envelope{min-height:105px;font-size:35px}.announcement{min-height:290px;padding:22px 16px}.announce-name{font-size:clamp(34px,9vw,56px)}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand">LOVE LIVE! DRAFT CONFERENCE</span>
    <span id="roomTag" class="status hidden"></span>
  </div>
  <h1 class="heading">スクールアイドル ドラフト会議</h1>
  <div id="app"></div>
</main>
<script>
  const $ = (selector) => document.querySelector(selector);
  const app = $('#app');
  let meta = [];
  let state = null;
  let session = JSON.parse(localStorage.getItem('lldraft-session') || 'null');
  let selected = null;
  let selectedSchool = null;
  let events = null;

  const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const esc = escapeHTML;

  function msg(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.append(el);
    setTimeout(() => el.remove(), 3800);
  }

  async function api(route, data = {}) {
    const response = await fetch('/api/' + route, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...data, ...(session ? { code: session.code, token: session.token } : {}) })
    });
    const result = await response.json();
    if (!response.ok) throw Error(result.error || '通信に失敗したよ');
    return result;
  }

  async function action(route, data = {}) {
    try {
      await api(route, data);
      await refresh();
    } catch (error) {
      msg(error.message);
    }
  }

  async function refresh() {
    if (!session) return render();
    try {
      const query = new URLSearchParams({ room: session.code, token: session.token });
      const response = await fetch('/api/state?' + query.toString());
      if (!response.ok) throw Error('ルームが見つからないよ');
      const next = await response.json();
      const previousStage = state?.stage;
      state = next;
      if (previousStage !== next.stage) selected = null;
      render();
    } catch (error) {
      msg(error.message);
      clearSession(false);
    }
  }

  function listen() {
    if (!session) return;
    if (events) events.close();
    events = new EventSource('/api/events?room=' + session.code);
    events.onmessage = () => refresh();
  }

  function clearSession(renderNow = true) {
    if (events) {
      events.close();
      events = null;
    }
    session = null;
    state = null;
    selected = null;
    selectedSchool = null;
    localStorage.removeItem('lldraft-session');
    history.replaceState(null, '', location.pathname);
    if (renderNow) render();
  }

  async function leaveRoom() {
    const started = state && state.stage !== 'lobby';
    const ok = confirm(started
      ? '画面から退出する？ 進行中・終了後のドラフト結果はこの端末では解除され、トップ画面へ戻るよ。'
      : 'このルームから退出する？ ホストが退出すると待機ルームは閉じるよ。');
    if (!ok) return;
    try {
      if (!started) await api('leave', {});
      clearSession(true);
    } catch (error) {
      msg(error.message);
    }
  }

  function setSession(nextSession) {
    session = nextSession;
    localStorage.setItem('lldraft-session', JSON.stringify(session));
    listen();
    refresh();
  }

  function player(playerId) {
    return state.players.find((p) => p.id === playerId);
  }

  function pickedHistoryFor(playerId) {
    return state.history.filter((entry) => entry.team === playerId).sort((a, b) => a.round - b.round);
  }

  function picker() {
    const schools = [...new Set(state.candidates.map((candidate) => candidate.school))];
    if (!schools.includes(selectedSchool)) selectedSchool = schools[0] || null;
    if (!state.candidates.some((candidate) => candidate.id === selected && candidate.school === selectedSchool)) selected = null;
    return `
      <div class="field">
        <label>① 学校を選択</label>
        <div class="school-tabs" id="schoolTabs" role="group" aria-label="学校を選択">
          ${schools.map((school) => `<button type="button" class="school-tab ${school === selectedSchool ? 'active' : ''}" data-school="${esc(school)}" aria-pressed="${school === selectedSchool}">${esc(school)}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>② スクールアイドルを選択</label>
        <div class="candidate-tabs" id="candidateTabs" role="group" aria-label="スクールアイドルを選択"></div>
        <p class="muted small" id="selectedLabel">キャラクターを選んでね</p>
      </div>`;
  }

  function chosen() {
    return state?.candidates.some((candidate) => candidate.id === selected && candidate.school === selectedSchool) ? selected : null;
  }

  function bindCandidateFilter() {
    const tabs = $('#schoolTabs');
    const candidates = $('#candidateTabs');
    if (!tabs || !candidates) return;
    const renderCandidates = () => {
      candidates.innerHTML = state.candidates.filter((candidate) => candidate.school === selectedSchool)
        .map((candidate) => `<button type="button" class="candidate-tab ${candidate.id === selected ? 'active' : ''}" data-candidate="${esc(candidate.id)}" aria-pressed="${candidate.id === selected}">${esc(candidate.name)}</button>`).join('');
      $('#selectedLabel').textContent = selected ? `指名候補：${state.candidates.find(c => c.id === selected)?.name || ''}` : 'キャラクターを選んでね';
      candidates.querySelectorAll('[data-candidate]').forEach((button) => button.addEventListener('click', () => {
        selected = button.dataset.candidate;
        renderCandidates();
      }));
    };
    tabs.querySelectorAll('[data-school]').forEach((button) => button.addEventListener('click', () => {
      selectedSchool = button.dataset.school;
      selected = null;
      tabs.querySelectorAll('[data-school]').forEach((tab) => {
        const active = tab.dataset.school === selectedSchool;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-pressed', String(active));
      });
      renderCandidates();
    }));
    renderCandidates();
  }

  function announcementCard(candidate, teamName, roundLabel, subtitle) {
    if (!candidate) {
      return `
        <div class="announcement">
          <div class="announce-kicker">LOVE LIVE! DRAFT CONFERENCE</div>
          <div class="announce-round">${esc(roundLabel)}</div>
          <div class="announce-team">指名発表を開始します</div>
          <div class="announce-sub">準備ができたら次へ進んでね</div>
        </div>`;
    }
    return `
      <div class="announcement">
        <div class="announce-kicker">LOVE LIVE! DRAFT CONFERENCE</div>
        <div class="announce-round">${esc(roundLabel)}</div>
        <div class="announce-team">${esc(teamName)}</div>
        <div class="announce-school">${esc(candidate.school)}</div>
        <div class="announce-name">${esc(candidate.name)}</div>
        <div class="announce-sub">${esc(subtitle || '交渉権獲得を目指します')}</div>
      </div>`;
  }

  function simpleScreen(candidate, teamName) {
    return `
      <div class="screen">
        <div class="gold">抽選対象スクールアイドル</div>
        <div class="team">${esc(teamName)}</div>
        <div class="school">${esc(candidate.school)}</div>
        <div class="person">${esc(candidate.name)}</div>
      </div>`;
  }

  function renderSummaryCard(entry, index) {
    return `
      <div class="result-item">
        <div class="badge">${index + 1}</div>
        <div>
          <div class="result-title">${esc(entry.candidate.name)}</div>
          <div class="result-meta">${esc(entry.candidate.school)} ／ ${esc(entry.method)} ／ ${entry.round}巡目</div>
        </div>
      </div>`;
  }

  function renderHome() {
    app.innerHTML = `
      <div class="grid">
        <section class="panel">
          <h2>ルームを作成</h2>
          <div class="field"><label>球団名</label><input id="createName" maxlength="24" value="球団A"></div>
          <div class="field"><label>球団数</label><select id="teams">${Array.from({ length: 11 }, (_, i) => i + 2).map((n) => `<option ${n === 5 ? 'selected' : ''} value="${n}">${n}球団</option>`).join('')}</select></div>
          <div class="field"><label>1球団の最大指名人数</label><select id="maxPicks"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></div>
          <p>対象グループ（複数選択）</p>
          <div class="field">${meta.map((work) => `<label class="choice"><input type="checkbox" class="group" value="${work.id}" checked> ${esc(work.label)}（${work.count}人）</label>`).join('')}</div>
          <div class="muted small" id="capacity"></div>
          <br>
          <button id="create">ルーム作成</button>
        </section>
        <section class="panel">
          <h2>ルームに参加</h2>
          <div class="field"><label>ルームコード</label><input id="joinCode" maxlength="8" placeholder="例：A1B2C3D4"></div>
          <div class="field"><label>球団名</label><input id="joinName" maxlength="24" placeholder="あなたの球団名"></div>
          <button id="join">参加する</button>
          <p class="muted small">同じルームURLを共有すれば、別の端末から参加できるよ。</p>
        </section>
      </div>`;

    const updateCapacity = () => {
      const count = [...document.querySelectorAll('.group:checked')].reduce((sum, checkbox) => {
        const work = meta.find((item) => item.id === checkbox.value);
        return sum + (work?.count || 0);
      }, 0);
      $('#capacity').textContent = `候補 ${count}人 ／ 最大指名枠 ${Number($('#teams').value) * Number($('#maxPicks').value)}人`;
    };
    document.querySelectorAll('.group,#teams,#maxPicks').forEach((el) => el.addEventListener('change', updateCapacity));
    updateCapacity();

    $('#create').onclick = async () => {
      try {
        const groups = [...document.querySelectorAll('.group:checked')].map((el) => el.value);
        const created = await api('create', {
          groups,
          teams: Number($('#teams').value),
          maxPicks: Number($('#maxPicks').value),
          name: $('#createName').value
        });
        setSession(created);
      } catch (error) {
        msg(error.message);
      }
    };

    $('#join').onclick = async () => {
      try {
        const joined = await api('join', { code: $('#joinCode').value, name: $('#joinName').value });
        setSession(joined);
      } catch (error) {
        msg(error.message);
      }
    };
  }

  function renderRoom() {
    const tag = $('#roomTag');
    tag.classList.toggle('hidden', !session);
    tag.textContent = session ? 'ROOM ' + session.code : '';

    let html = `
      <section class="panel">
        <div class="row between">
          <div>
            <span class="gold">${esc(state.settings.teams)}球団 ／ ${state.settings.maxPicks}巡上限</span>
            <p class="muted small">参加作品：${state.settings.groups.map((groupId) => meta.find((work) => work.id === groupId)?.label || groupId).join('・')}</p>
          </div>
          <div class="row">
            <button class="secondary" id="share">ルームURLをコピー</button>
            <button class="secondary" id="leaveRoom">退出する</button>
          </div>
        </div>
        <div class="grid">${state.players.map((p) => {
          const mine = p.id === state.selfId ? '（あなた）' : '';
          return `<div class="choice"><b>${esc(p.name)}</b>${mine}<div class="muted small">獲得 ${p.picks.length}人</div></div>`;
        }).join('')}</div>
      </section>`;

    if (state.stage === 'lobby') {
      html += `
        <section class="panel">
          <h2>参加者を受付中</h2>
          <p>${state.players.length} / ${state.settings.teams} 球団が参加済み</p>
          <p class="muted">全員揃ったらドラフト開始！</p>
          ${state.host
            ? `<button data-route="start" ${state.players.length !== state.settings.teams ? 'disabled' : ''}>ドラフト会議を開始</button>`
            : '<p>ホストの開始を待ってね。</p>'}
        </section>`;
    }

    if (state.stage === 'auction') {
      const eligible = state.auctionTeams.includes(state.selfId);
      html += `
        <section class="panel">
          <h2>第1巡 ${state.round === 1 ? '入札' : '外れ指名・再入札'}</h2>
          <p class="muted">指名確定 ${state.submitted} / ${state.required} 球団。候補は発表まで非公開。</p>
          ${eligible
            ? (state.submittedMine
              ? '<div class="status">指名提出済み。発表を待とう！</div>'
              : `${picker()}<button data-route="bid">指名を確定する</button>`)
            : '<div class="status">この抽選は見守り中</div>'}
        </section>`;
    }

    if (state.stage === 'reveal') {
      const current = state.announcement;
      html += `
        <section class="panel">
          <div class="row between"><h2>第1巡 指名発表</h2><span class="gold">発表 ${state.queueIndex} / ${state.queue.length}</span></div>
          ${announcementCard(current?.candidate, current ? player(current.team).name : '', `第${state.round}回 選択希望スクールアイドル`, '各球団の入札結果を発表します')}
          <p class="muted">各球団の提出内容を順番に公開。全員分の発表後、競合抽選へ進むよ。</p>
          ${state.host ? `<button data-route="reveal">${state.queueIndex === state.queue.length ? '発表を終了・競合抽選へ' : '次の球団を発表'}</button>` : '<p>ホストの発表操作を待ってね。</p>'}
        </section>`;
    }

    if (state.stage === 'lottery') {
      const lottery = state.lottery;
      const candidate = state.candidates.find((c) => c.id === lottery.candidate) || state.history.find((entry) => entry.candidate.id === lottery.candidate)?.candidate;
      const currentTeam = lottery.teams[lottery.drawIndex];
      const myTurn = currentTeam === state.selfId;
      const myDraw = lottery.draws.find((draw) => draw.team === state.selfId && !draw.opened);
      html += `
        <section class="panel">
          <h2>交渉権獲得抽選　${lottery.teams.length}球団競合</h2>
          ${simpleScreen(candidate, lottery.teams.map((id) => player(id).name).join(' ／ '))}
          <p class="gold">${lottery.revealed ? '抽選終了' : myDraw ? '封筒を開けて結果を確認！' : currentTeam ? `${esc(player(currentTeam).name)} が抽選する番！` : '抽選終了'}</p>
          <div class="envelopes">${Array.from({ length: lottery.teams.length }, (_, i) => {
            const draw = lottery.draws.find((item) => item.envelope === i);
            return `<button class="envelope" ${!myTurn || !!myDraw || !!draw || lottery.revealed ? 'disabled' : ''} data-envelope="${i}">
              <span>${draw?.opened ? (draw.win ? '★' : '×') : '✉'}</span>
              <small>封筒 ${i + 1}</small>
              <small>${draw ? esc(player(draw.team).name) : '未選択'}</small>
            </button>`;
          }).join('')}</div>
          ${myDraw ? '<p><button data-route="open">自分の封筒を開封する</button></p>' : ''}
          <div class="panel" style="margin-top:18px">${lottery.draws.map((draw) => `
            <div class="pick">${esc(player(draw.team).name)} — ${draw.opened ? (draw.win ? '<b class="gold">当選！ 交渉権獲得</b>' : '外れ') : '開封待ち'}</div>`).join('') || '<span class="muted">まだ誰も引いていません</span>'}</div>
          ${lottery.revealed ? (state.host ? '<button data-route="next-lottery">次へ進む</button>' : '<p>ホストの進行を待ってね。</p>') : ''}
        </section>`;
    }

    if (state.stage === 'waiver') {
      const turn = state.waiverTurn;
      const turnPlayer = player(turn);
      html += `
        <section class="panel">
          <h2>第${state.round}巡 ウェーバー指名</h2>
          <p class="gold big">${esc(turnPlayer?.name || '')} の指名順</p>
          ${turn === state.selfId ? `${picker()}<button data-route="waiver">指名を確定・発表</button>` : '<p class="muted">指名確定を待ってね。</p>'}
        </section>`;
    }

    if (state.stage === 'waiver-reveal') {
      const current = state.announcement;
      html += `
        <section class="panel">
          <div class="row between"><h2>第${state.round}巡 指名発表</h2><span class="gold">ウェーバー指名</span></div>
          ${announcementCard(current?.candidate, current ? player(current.team).name : '', `第${state.round}回 選択希望スクールアイドル`, '交渉権獲得！')}
          <p class="muted">2巡目以降も、1人ずつ順番に発表します。</p>
          ${state.host ? '<button data-route="next-waiver">次へ進む</button>' : '<p>ホストの進行を待ってね。</p>'}
        </section>`;
    }

    if (state.stage === 'done') {
      const mine = pickedHistoryFor(state.selfId);
      html += `
        <section class="panel">
          <h2>ドラフト会議 終了！</h2>
          ${announcementCard(null, '', 'FINAL', '全指名が確定しました')}
        </section>
        <section class="panel">
          <div class="row between">
            <div>
              <h3 style="margin:0 0 8px">あなたの指名結果</h3>
              <p class="muted small" style="margin:0">球団名：${esc(player(state.selfId)?.name || '')}</p>
            </div>
            <div class="actions">
              <button id="saveImage">画像で保存</button>
              <button class="secondary" id="leaveAfterDone">退出してトップへ戻る</button>
            </div>
          </div>
          <div class="results" style="margin-top:16px">${mine.map((entry, index) => renderSummaryCard(entry, index)).join('') || '<p class="muted">まだ指名結果がありません。</p>'}</div>
        </section>
        <section class="panel">
          <h3>全体結果</h3>
          <div class="grid">${state.players.map((p) => `
            <div class="choice">
              <b>${esc(p.name)}</b>
              <div class="results" style="margin-top:10px">${pickedHistoryFor(p.id).map((entry, index) => renderSummaryCard(entry, index)).join('') || '<span class="muted small">指名なし</span>'}</div>
            </div>`).join('')}</div>
        </section>`;
    }

    app.innerHTML = html;

    $('#share')?.addEventListener('click', async () => {
      const url = `${location.origin}?room=${session.code}`;
      try {
        await navigator.clipboard.writeText(url);
        msg('ルームURLをコピーしたよ！');
      } catch {
        msg('コピーに失敗したよ');
      }
    });
    $('#leaveRoom')?.addEventListener('click', leaveRoom);
    $('#leaveAfterDone')?.addEventListener('click', leaveRoom);
    $('#saveImage')?.addEventListener('click', saveResultImage);

    bindCandidateFilter();
    document.querySelectorAll('[data-route]').forEach((button) => {
      button.addEventListener('click', () => {
        const route = button.dataset.route;
        const candidate = chosen();
        if (['bid', 'waiver'].includes(route) && !candidate) {
          msg('候補者を選んでね');
          return;
        }
        action(route, candidate ? { candidate } : {});
      });
    });
    document.querySelectorAll('[data-envelope]').forEach((button) => {
      button.addEventListener('click', () => action('draw', { envelope: Number(button.dataset.envelope) }));
    });
  }

  function saveResultImage() {
    if (!state || state.stage !== 'done') return msg('ドラフト終了後に使えるよ');
    const myTeam = player(state.selfId);
    const picks = pickedHistoryFor(state.selfId);
    if (!myTeam) return msg('球団情報が見つからないよ');

    const width = 1400;
    const rowHeight = 126;
    const headerHeight = 280;
    const footerHeight = 120;
    const height = headerHeight + Math.max(1, picks.length) * rowHeight + footerHeight;

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    const bg = ctx.createLinearGradient(0, 0, width, height);
    bg.addColorStop(0, '#0f2033');
    bg.addColorStop(1, '#071321');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    const glow = ctx.createRadialGradient(width * 0.5, 0, 40, width * 0.5, 0, 480);
    glow.addColorStop(0, 'rgba(255,218,150,.24)');
    glow.addColorStop(1, 'rgba(255,218,150,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, 400);

    ctx.strokeStyle = 'rgba(217,186,121,.75)';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, width - 56, height - 56);

    ctx.fillStyle = '#d9ba79';
    ctx.font = '700 24px sans-serif';
    ctx.fillText('LOVE LIVE! DRAFT CONFERENCE', 70, 88);

    ctx.fillStyle = '#f3f7fb';
    ctx.font = '800 62px sans-serif';
    ctx.fillText(myTeam.name, 68, 170);

    ctx.fillStyle = '#d0dceb';
    ctx.font = '500 26px sans-serif';
    ctx.fillText('あなたのドラフト指名結果', 70, 216);
    ctx.fillText(`ROOM ${state.code}  /  全${state.settings.maxPicks}巡`, 70, 252);

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(60, headerHeight - 16);
    ctx.lineTo(width - 60, headerHeight - 16);
    ctx.stroke();

    if (!picks.length) {
      ctx.fillStyle = '#edf2f9';
      ctx.font = '700 38px sans-serif';
      ctx.fillText('指名結果はありません', 70, headerHeight + 70);
    } else {
      picks.forEach((entry, index) => {
        const y = headerHeight + index * rowHeight;
        ctx.fillStyle = 'rgba(23,40,58,.88)';
        roundRect(ctx, 58, y + 6, width - 116, rowHeight - 16, 18, true, false);

        ctx.fillStyle = '#d9ba79';
        ctx.beginPath();
        ctx.arc(112, y + 54, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#172238';
        ctx.font = '800 28px sans-serif';
        const roundNum = String(index + 1);
        ctx.fillText(roundNum, 104 - (roundNum.length - 1) * 4, y + 64);

        ctx.fillStyle = '#f7fbff';
        ctx.font = '800 36px sans-serif';
        ctx.fillText(entry.candidate.name, 170, y + 48);
        ctx.fillStyle = '#d3deeb';
        ctx.font = '500 23px sans-serif';
        ctx.fillText(entry.candidate.school, 170, y + 82);
        ctx.fillStyle = '#d9ba79';
        ctx.font = '700 22px sans-serif';
        ctx.fillText(`${entry.round}巡目 ／ ${entry.method}`, width - 320, y + 64);
      });
    }

    ctx.fillStyle = '#adc0d3';
    ctx.font = '500 20px sans-serif';
    ctx.fillText('Generated by Love Live Draft Conference', 70, height - 56);

    const link = document.createElement('a');
    link.download = `lovelive-draft-${(myTeam.name || 'result').replace(/[\\/:*?"<>|]/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    msg('指名結果を画像として保存したよ！');
  }

  function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
    if (typeof radius === 'number') {
      radius = { tl: radius, tr: radius, br: radius, bl: radius };
    }
    ctx.beginPath();
    ctx.moveTo(x + radius.tl, y);
    ctx.lineTo(x + width - radius.tr, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
    ctx.lineTo(x + width, y + height - radius.br);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
    ctx.lineTo(x + radius.bl, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
    ctx.lineTo(x, y + radius.tl);
    ctx.quadraticCurveTo(x, y, x + radius.tl, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function render() {
    const tag = $('#roomTag');
    tag.classList.toggle('hidden', !session);
    if (!session) {
      tag.textContent = '';
      renderHome();
      return;
    }
    if (!state) return;
    renderRoom();
  }

  (async function init() {
    try {
      meta = (await (await fetch('/api/meta')).json()).works;
      const roomParam = new URLSearchParams(location.search).get('room');
      if (!session && roomParam) {
        renderHome();
        $('#joinCode').value = roomParam;
      } else if (session) {
        listen();
        await refresh();
      } else {
        renderHome();
      }
    } catch (error) {
      app.innerHTML = '<div class="panel">読み込みに失敗しました。ページを再読み込みしてね。</div>';
    }
  })();
</script>
</body>
</html>
